<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Anggota - IGORNAS Kota Sukabumi</title>

  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --accent: #dc2626;
      --gold: #f59e0b;
      --navy: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: 
        linear-gradient(135deg, rgba(15, 23, 42, 0.88), rgba(30, 58, 138, 0.85)),
        url('assets/sports-bg.jpg') no-repeat center center / cover;
      padding: 40px 15px;
      color: #0f172a;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 42px 38px;
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.4) inset;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-img {
      width: 95px;
      height: 95px;
      object-fit: contain;
      margin-bottom: 12px;
      filter: drop-shadow(0 8px 16px rgba(30, 58, 138, 0.3));
    }

    h1 {
      color: var(--navy);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #64748b;
      font-size: 14px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary-dark);
      margin: 30px 0 18px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
    }

    .required {
      color: var(--accent);
    }

    input, select, textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      background: #ffffff;
      transition: all 0.2s ease;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      padding-right: 44px;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 15px;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: var(--primary);
    }

    .checkbox-area {
      margin-top: 24px;
      padding: 16px;
      background: #f1f5f9;
      border-radius: 12px;
      font-size: 13px;
      color: #475569;
    }

    .checkbox-area input {
      width: auto;
      margin-right: 10px;
    }

    .button-area {
      display: flex;
      gap: 14px;
      margin-top: 30px;
    }

    .btn {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.25s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(37, 99, 235, 0.45);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #334155;
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    .message {
      display: none;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 24px;
      font-size: 14px;
      font-weight: 600;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .message.success {
      display: block;
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .result-box {
      display: none;
      margin-top: 24px;
      padding: 24px;
      background: #eff6ff;
      border: 1.5px solid #bfdbfe;
      border-radius: 14px;
    }

    .result-box h3 {
      color: var(--primary-dark);
      margin-bottom: 14px;
    }

    .result-item {
      margin-bottom: 8px;
      font-size: 14px;
    }

    .result-item strong {
      display: inline-block;
      width: 160px;
    }

    .login-link {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #64748b;
    }

    .login-link a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }

    @media (max-width: 650px) {
      .form-grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
      .button-area { flex-direction: column; }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <div class="header">
        <img src="assets/logo.png" alt="Logo IGORNAS" class="logo-img" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/5328/5328224.png'">
        <h1>Pendaftaran Anggota IGORNAS</h1>
        <div class="subtitle">Sistem Informasi Anggota Kota Sukabumi</div>
      </div>

      <div id="message" class="message"></div>

      <form id="registerForm">

        <div class="section-title"><i class="fa-solid fa-user"></i> Data Pribadi</div>
        <div class="form-grid">
          <div class="form-group full">
            <label for="nama">Nama Lengkap <span class="required">*</span></label>
            <input type="text" id="nama" placeholder="Masukkan nama lengkap beserta gelar" required>
          </div>

          <div class="form-group">
            <label for="nik">NIK (Nomor Induk Kependudukan) <span class="required">*</span></label>
            <input type="text" id="nik" inputmode="numeric" maxlength="16" placeholder="16 digit NIK" required>
          </div>

          <div class="form-group">
            <label for="nip">NIP / NUPTK</label>
            <input type="text" id="nip" placeholder="Nomor NIP / NUPTK (Opsional)">
          </div>

          <div class="form-group">
            <label for="jenisKelamin">Jenis Kelamin</label>
            <select id="jenisKelamin">
              <option value="">-- Pilih Jenis Kelamin --</option>
              <option value="L">Laki-laki</option>
              <option value="P">Perempuan</option>
            </select>
          </div>

          <div class="form-group">
            <label for="tempatLahir">Tempat Lahir</label>
            <input type="text" id="tempatLahir" placeholder="Kota tempat lahir">
          </div>

          <div class="form-group">
            <label for="tanggalLahir">Tanggal Lahir</label>
            <input type="date" id="tanggalLahir">
          </div>

          <div class="form-group">
            <label for="kecamatan">Kecamatan Domisili (Tempat Tinggal)</label>
            <input type="text" id="kecamatan" placeholder="Nama kecamatan domisili">
          </div>

          <div class="form-group">
            <label for="kelurahan">Kelurahan Domisili</label>
            <input type="text" id="kelurahan" placeholder="Nama kelurahan domisili">
          </div>

          <div class="form-group full">
            <label for="alamat">Alamat Lengkap Rumah / Tempat Tinggal</label>
            <textarea id="alamat" placeholder="Alamat rumah tinggal (RT/RW, Jalan, No. Rumah)"></textarea>
          </div>

          <div class="form-group full">
            <label for="noHp">Nomor WhatsApp / HP</label>
            <input type="tel" id="noHp" placeholder="08xxxxxxxxxx">
          </div>
        </div>

        <div class="section-title"><i class="fa-solid fa-graduation-cap"></i> Data Keanggotaan & Profesi</div>
        <div class="form-grid">
          <div class="form-group">
            <label for="sekolah">Sekolah / Instansi Mengajar <span class="required">*</span></label>
            <input type="text" id="sekolah" placeholder="Contoh: SMPN 4 Kota Sukabumi" required>
          </div>

          <div class="form-group">
            <label for="jenjang">Jenjang Sekolah</label>
            <select id="jenjang">
              <option value="">-- Pilih Jenjang --</option>
              <option value="SD">SD</option>
              <option value="SMP">SMP</option>
              <option value="SMA">SMA</option>
              <option value="SMK">SMK</option>
              <option value="MI">MI</option>
              <option value="MTS">MTs</option>
              <option value="MA">MA</option>
              <option value="LAINNYA">Lainnya</option>
            </select>
          </div>

          <div class="form-group">
            <label for="kecamatanSekolah">Kecamatan Unit Kerja / Sekolah <span class="required">*</span></label>
            <select id="kecamatanSekolah" required>
              <option value="">-- Pilih Kecamatan Sekolah --</option>
              <option value="Baros">Baros</option>
              <option value="Cibeureum">Cibeureum</option>
              <option value="Cikole">Cikole</option>
              <option value="Citamiang">Citamiang</option>
              <option value="Gunungpuyuh">Gunungpuyuh</option>
              <option value="Lembursitu">Lembursitu</option>
              <option value="Warudoyong">Warudoyong</option>
            </select>
          </div>

          <div class="form-group">
            <label for="kelurahanSekolah">Kelurahan Unit Kerja / Sekolah</label>
            <input type="text" id="kelurahanSekolah" placeholder="Nama kelurahan lokasi sekolah">
          </div>

          <div class="form-group">
            <label for="jabatan">Jabatan</label>
            <select id="jabatan">
              <option value="Guru PJOK" selected>Guru PJOK</option>
              <option value="Kepala Sekolah">Kepala Sekolah</option>
              <option value="Instansi Lainnya">Instansi Lainnya</option>
            </select>
          </div>

          <div class="form-group full">
            <label for="alamatSekolah">Alamat Lengkap Unit Kerja / Sekolah</label>
            <input type="text" id="alamatSekolah" placeholder="Alamat jalan / lokasi sekolah mengajar">
          </div>

          <div class="form-group full">
            <label for="cabor">Spesialisasi Cabang Olahraga</label>
            <input type="text" id="cabor" placeholder="Contoh: Sepak Bola, Atletik, Voli">
          </div>
        </div>

        <div class="section-title"><i class="fa-solid fa-lock"></i> Akun Login</div>
        <div class="form-grid">
          <div class="form-group full">
            <label for="email">Alamat Email <span class="required">*</span></label>
            <input type="email" id="email" placeholder="email@contoh.com" required>
          </div>

          <div class="form-group">
            <label for="password">Kata Sandi <span class="required">*</span></label>
            <div class="input-wrapper">
              <input type="password" id="password" placeholder="Minimal 8 karakter" minlength="8" required autocomplete="new-password">
              <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', 'eyePassword')" aria-label="Lihat kata sandi">
                <i class="fa-regular fa-eye" id="eyePassword"></i>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="passwordConfirm">Konfirmasi Kata Sandi <span class="required">*</span></label>
            <div class="input-wrapper">
              <input type="password" id="passwordConfirm" placeholder="Ulangi kata sandi" minlength="8" required autocomplete="new-password">
              <button type="button" class="toggle-password" onclick="togglePasswordVisibility('passwordConfirm', 'eyePasswordConfirm')" aria-label="Lihat konfirmasi kata sandi">
                <i class="fa-regular fa-eye" id="eyePasswordConfirm"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="checkbox-area">
          <label>
            <input type="checkbox" id="agreement" required>
            Saya menyatakan bahwa seluruh data yang saya masukkan adalah benar dan siap menjadi anggota IGORNAS.
          </label>
        </div>

        <div class="button-area">
          <a href="index.html" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Kembali Login</a>
          <button type="submit" id="registerButton" class="btn btn-primary">
            <span>DAFTAR SEKARANG</span>
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>

      </form>

      <div id="resultBox" class="result-box">
        <h3><i class="fa-solid fa-circle-check" style="color: #166534;"></i> Pendaftaran Berhasil!</h3>
        <div class="result-item"><strong>Member ID:</strong> <span id="resultMemberId"></span></div>
        <div class="result-item"><strong>Nomor Anggota:</strong> <span id="resultNomorAnggota"></span></div>
        <div class="result-item"><strong>User ID:</strong> <span id="resultUserId"></span></div>
        <div class="result-item"><strong>Email:</strong> <span id="resultEmail"></span></div>
        <div class="result-item"><strong>Status:</strong> <span id="resultStatus"></span></div>
        <div class="result-item"><strong>Role:</strong> <span id="resultRole"></span></div>
      </div>

      <div class="login-link">
        Sudah memiliki akun? <a href="index.html">Login di sini</a>
      </div>

    </div>
  </div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbyotXwO6JGHPG7QydoOswO3-5FOttn5SqZqeupS2_KItOb3t9EQ99tcC1bQH9cNqCS4/exec';

  const registerForm = document.getElementById('registerForm');
  const registerButton = document.getElementById('registerButton');
  const message = document.getElementById('message');
  const resultBox = document.getElementById('resultBox');

  function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (!input || !icon) return;
    if (input.type === 'password') {
      input.type = 'text';
      icon.classList.remove('fa-eye');
      icon.classList.add('fa-eye-slash');
    } else {
      input.type = 'password';
      icon.classList.remove('fa-eye-slash');
      icon.classList.add('fa-eye');
    }
  }

  function showMessage(text, type) {
    message.textContent = text;
    message.className = 'message ' + type;
  }

  function hideMessage() {
    message.textContent = '';
    message.className = 'message';
  }

  function formatNomorAnggota(no) {
    if (!no) return '';
    let str = String(no).trim().replace(/^'+/, '');
    if (str.length === 13 && str.startsWith('6210208')) {
      return '0' + str;
    }
    return str;
  }

  function showResult(data) {
    resultBox.style.display = 'block';
    document.getElementById('resultMemberId').textContent = data.MEMBER_ID || '-';
    document.getElementById('resultNomorAnggota').textContent = formatNomorAnggota(data.NOMOR_ANGGOTA) || '-';
    document.getElementById('resultUserId').textContent = data.USER_ID || '-';
    document.getElementById('resultEmail').textContent = data.EMAIL || '-';
    document.getElementById('resultStatus').textContent = data.STATUS || '-';
    document.getElementById('resultRole').textContent = data.ROLE || '-';
  }

  function validateNIK(nik) {
    return /^\d{16}$/.test(nik);
  }

  registerForm.addEventListener('submit', async function(event) {
    event.preventDefault();
    hideMessage();
    resultBox.style.display = 'none';

    const nama = document.getElementById('nama').value.trim();
    const nik = document.getElementById('nik').value.trim();
    const nip = document.getElementById('nip').value.trim();
    const jenisKelamin = document.getElementById('jenisKelamin').value;
    const tempatLahir = document.getElementById('tempatLahir').value.trim();
    const tanggalLahir = document.getElementById('tanggalLahir').value;
    const alamat = document.getElementById('alamat').value.trim();
    const kecamatan = document.getElementById('kecamatan').value.trim();
    const kelurahan = document.getElementById('kelurahan').value.trim();
    let noHp = document.getElementById('noHp').value.trim();
    if (noHp.startsWith('8') && noHp.length >= 9) {
      noHp = '0' + noHp;
    }
    const sekolah = document.getElementById('sekolah').value.trim();
    const jenjang = document.getElementById('jenjang').value;
    const kecamatanSekolah = document.getElementById('kecamatanSekolah').value.trim();
    const kelurahanSekolah = document.getElementById('kelurahanSekolah').value.trim();
    const alamatSekolah = document.getElementById('alamatSekolah').value.trim();
    const jabatan = document.getElementById('jabatan').value.trim();
    const cabor = document.getElementById('cabor').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const passwordConfirm = document.getElementById('passwordConfirm').value;

    if (!nama) return showMessage('Nama lengkap wajib diisi.', 'error');
    if (!validateNIK(nik)) return showMessage('NIK harus terdiri dari 16 digit angka.', 'error');
    if (!sekolah) return showMessage('Sekolah / Instansi Mengajar wajib diisi.', 'error');
    if (!kecamatanSekolah) return showMessage('Kecamatan Unit Kerja / Sekolah wajib dipilih.', 'error');
    if (!email) return showMessage('Email wajib diisi.', 'error');
    if (password.length < 8) return showMessage('Password minimal 8 karakter.', 'error');
    if (password !== passwordConfirm) return showMessage('Konfirmasi password tidak sama.', 'error');

    registerButton.disabled = true;

    try {
      const data = {
        NAMA_LENGKAP: nama,
        NIK: nik,
        NIP_NUPTK: nip,
        JENIS_KELAMIN: jenisKelamin,
        TEMPAT_LAHIR: tempatLahir,
        TANGGAL_LAHIR: tanggalLahir,
        ALAMAT: alamat,
        KECAMATAN_ID: kecamatan,
        KELURAHAN: kelurahan,
        NO_HP: noHp,
        EMAIL: email,
        SEKOLAH_ID: sekolah,
        JENJANG: jenjang,
        KECAMATAN_SEKOLAH: kecamatanSekolah,
        KELURAHAN_SEKOLAH: kelurahanSekolah,
        ALAMAT_SEKOLAH: alamatSekolah,
        JABATAN: jabatan,
        CABOR_ID: cabor,
        PASSWORD: password
      };

      const response = await fetch(API_URL + '?action=register', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data)
      });

      const result = await response.json();

      if (result.success) {
        showMessage(result.message || 'Pendaftaran berhasil.', 'success');
        if (result.data) showResult(result.data);
        registerForm.reset();
        resultBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else {
        showMessage(result.message || 'Pendaftaran gagal.', 'error');
      }
    } catch (error) {
      console.error('Error pendaftaran:', error);
      showMessage('Tidak dapat terhubung ke server. Periksa koneksi internet.', 'error');
    } finally {
      registerButton.disabled = false;
    }
  });
</script>

</body>
</html>
